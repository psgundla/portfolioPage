<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PSG monogram">
  <style>
    .bg { fill: #1A1A18; }
    .fg { fill: #FBFAF7; }
    .ac { fill: #E0A183; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #1A1A18; }
      .fg { fill: #FBFAF7; }
      .ac { fill: #E0A183; }
    }
  </style>
  <rect class="bg" x="2" y="2" width="60" height="60" rx="13" />
  <text x="32" y="43" text-anchor="middle"
        font-family="Newsreader, Georgia, 'Times New Roman', serif"
        font-size="31" font-weight="600" letter-spacing="-1.5">
    <tspan class="fg">P</tspan><tspan class="ac">S</tspan><tspan class="fg">G</tspan>
  </text>
</svg>
